services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: realestate
      POSTGRES_USER: realestate
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres18_data:/var/lib/postgresql

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: realestate
      MONGO_INITDB_ROOT_PASSWORD: devpassword
    volumes:
      - mongo_data:/data/db

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull-llama31:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: [ "/bin/sh", "-lc" ]
    command:
      - "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull llama3.1"

  uppercube:
    image: uppercube
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=realestate;Username=realestate;Password=devpassword
      ConnectionStrings__Mongo: mongodb://realestate:devpassword@mongo:27017/?authSource=admin
      AI__Enabled: true
      AI__Provider: Ollama
      AI__BaseUrl: http://ollama:11434
      AI__Model: llama3.1
      AI__TimeoutSeconds: 300
      AI__MaxTokens: 128
      AI__ContextLength: 512
      AI__Temperature: 0.2
    depends_on:
      postgres:
        condition: service_started
      mongo:
        condition: service_started
      ollama:
        condition: service_healthy
      ollama-pull-llama31:
        condition: service_completed_successfully

volumes:
  postgres18_data:
  mongo_data:
  ollama_data:
