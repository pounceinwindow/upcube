@@include("partials/main.html")

<head>

    @@include("partials/title-meta.html", {"title": "Register"})

    @@include("partials/head-css.html")

</head>

<body class="auth-body-bg">
<div class="bg-overlay"></div>
<div class="wrapper-page">
    <div class="container-fluid p-0">
        <div class="card">
            <div class="card-body">

                <div class="text-center mt-4">
                    <div class="mb-3">
                        <a class="auth-logo" href="index.html">
                            <img alt="" class="logo-dark mx-auto" height="30" src="assets/images/logo-dark.png">
                            <img alt="" class="logo-light mx-auto" height="30" src="assets/images/logo-light.png">
                        </a>
                    </div>
                </div>

                <h4 class="text-muted text-center font-size-18"><b>Register</b></h4>

                <div class="p-3">
                    <form action="index.html" class="form-horizontal mt-3">

                        <div class="form-group mb-3 row">
                            <div class="col-12">
                                <input class="form-control" placeholder="Email" required="" type="email">
                            </div>
                        </div>

                        <div class="form-group mb-3 row">
                            <div class="col-12">
                                <input class="form-control" placeholder="Username" required="" type="text">
                            </div>
                        </div>

                        <div class="form-group mb-3 row">
                            <div class="col-12">
                                <input class="form-control" placeholder="Password" required="" type="password">
                            </div>
                        </div>

                        <div class="form-group mb-3 row">
                            <div class="col-12">
                                <div class="custom-control custom-checkbox">
                                    <input class="custom-control-input" id="customCheck1" type="checkbox">
                                    <label class="form-label ms-1 fw-normal" for="customCheck1">I accept <a
                                            class="text-muted"
                                            href="#">Terms
                                        and Conditions</a></label>
                                </div>
                            </div>
                        </div>

                        <div class="form-group text-center row mt-3 pt-1">
                            <div class="col-12">
                                <button class="btn btn-info w-100 waves-effect waves-light" type="submit">Register
                                </button>
                            </div>
                        </div>

                        <div class="form-group mt-2 mb-0 row">
                            <div class="col-12 mt-3 text-center">
                                <a class="text-muted" href="pages-login.html">Already have account?</a>
                            </div>
                        </div>
                    </form>
                    <!-- end form -->
                </div>
            </div>
            <!-- end cardbody -->
        </div>
        <!-- end card -->
    </div>
    <!-- end container -->
</div>
<!-- end -->


@@include("partials/vendor-scripts.html")

<script src="assets/js/app.js"></script>

</body>
</html>
