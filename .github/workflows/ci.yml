name: CI

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]

jobs:
  build-and-docker-up:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UpperCube.sln

      - name: Build
        run: dotnet build UpperCube.sln 

      - name: Docker compose up
        run: docker compose up -d --build

      - name: Show running containers
        run: docker ps


      - name: Docker compose down
        if: always()
        run: docker compose down